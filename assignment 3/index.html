<!DOCTYPE html>
<html>
<head>
<title>Quiz App</title>
<style>
  body{font-family: Arial; max-width:600px; margin:50px auto; padding:20px}
  #options button{display:block; width:100%; padding:12px; margin:8px 0; border:2px solid #ddd; cursor:pointer; border-radius:8px; font-size:16px}
  #next{padding:10px 20px; margin-top:15px; background:#6c5ce7; color:white; border:none; border-radius:8px; cursor:pointer}
  #next:disabled{display:none}
</style>
</head>
<body>

<div id="quiz">
  <h2 id="question"></h2>
  <div id="options"></div>
  <button id="next">Next Question</button>
  <p>Score: <span id="scoreLive">0</span></p>
</div>

<script>
const questions = [
  { question: "What does localStorage do?", options: ["Temporary store", "Stores forever", "Only for session", "Deletes on refresh"], answer: "Stores forever" },
  { question: "Which converts object to string?", options: ["JSON.parse", "JSON.stringify", "toString", "parse"], answer: "JSON.stringify" },
  { question: "What is Promise used for?", options: ["Styling", "Handle async", "Loop", "DOM"], answer: "Handle async" },
  { question: "setTimeout goes to which queue?", options: ["Microtask", "Call Stack", "Macrotask", "Priority"], answer: "Macrotask" },
  { question: "Promise.then goes to?", options: ["Macrotask", "Microtask", "Stack", "Heap"], answer: "Microtask" },
  { question: "How to get item from localStorage?", options: ["getItem", "get", "fetch", "read"], answer: "getItem" },
  { question: "Which is callback hell solution?", options: ["Promise chaining", "for loop", "if else", "var"], answer: "Promise chaining" },
  { question: "What is closure?", options: ["Function + its lexical env", "Object", "Array method", "CSS property"], answer: "Function + its lexical env" }
];

let currentIndex = 0;
let score = 0;

const qEl = document.getElementById("question");
const optDiv = document.getElementById("options");
const nextBtn = document.getElementById("next");
const scoreLive = document.getElementById("scoreLive");

function renderQuestion(){
  const q = questions[currentIndex];
  qEl.innerText = `${currentIndex+1}. ${q.question}`;
  optDiv.innerHTML = "";
  nextBtn.style.display = "none";

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(btn, opt);
    optDiv.appendChild(btn);
  });
}

function checkAnswer(button, selected){
  const correct = questions[currentIndex].answer;
  const allBtns = document.querySelectorAll("#options button");
  allBtns.forEach(b => b.disabled = true);

  if(selected === correct){
    button.style.background = "#00b894";
    button.style.color = "white";
    score++;
    scoreLive.innerText = score;
  } else {
    button.style.background = "#d63031";
    button.style.color = "white";
    allBtns.forEach(b => {
      if(b.innerText === correct){
        b.style.background = "#00b894";
        b.style.color = "white";
      }
    });
  }
  nextBtn.style.display = "block";
}

nextBtn.onclick = () => {
  currentIndex++;
  if(currentIndex < questions.length){
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult(){
  let feedback = score >= 7 ? "Excellent!" : score >= 4 ? "Good job!" : "Keep practicing!";
  localStorage.setItem("lastScore", JSON.stringify({score, total: questions.length}));
  
  document.getElementById("quiz").innerHTML = `
    <h2>You scored ${score} out of ${questions.length} — ${feedback}</h2>
    <p>Last score saved in localStorage</p>
    <button onclick="restartQuiz()" style="padding:10px 20px; background:#6c5ce7; color:white; border:none; border-radius:8px">Restart Quiz</button>
  `;
}

function restartQuiz(){
  currentIndex = 0;
  score = 0;
  location.reload();
}

renderQuestion();
</script>
</body>
</html>
