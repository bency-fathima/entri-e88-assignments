 function saveCart() {

    function displayProducts(productList) {

if (existingItem) {

} else {

    });
}

const cartContainer = document.createElement("div")

function renderCart(product, item) {
    cartContainer.innerHTML = ""

    cart.forEach((item) => {
        const cartItem = document.createElement("div")
        cartItem.className = "cart"

        const productImg = document.createElement('img')
        productImg.src = item.imageUrl
        productImg.style.width = "200px"
        productImg.style.height = "250px"

        const productName = document.createElement("h3")
        productName.textContent = item.name

        const productPrice = document.createElement("p")
        productPrice.textContent = `₹${item.price}`

        cartItem.appendChild(productImg)
        cartItem.appendChild(productName)
        cartItem.appendChild(productPrice)

        cartContainer.appendChild(cartItem)

        const plusBtn = document.createElement("button")
plusBtn.textContent = "+"

const countBtn = document.createElement("button")
countBtn.textContent = item.quantity

const minusBtn = document.createElement("button")
minusBtn.textContent = "-"

const removeBtn = document.createElement('button')
removeBtn.textContent = "Remove"
removeBtn.className = "rmv"

 
 plusBtn.addEventListener('click', () => {
        item.quantity++
        renderCart()
        saveCart()
      })

       minusBtn.addEventListener('click', () => {
        if(item.quantity > 1) {
         item.quantity--
         renderCart()
         saveCart()
        } 
      })

     
      removeBtn.addEventListener("click", () => {
    const index = cart.findIndex(cartItem => cartItem.id === item.id);

    if (index !== -1) {
        cart.splice(index, 1);
    }
    saveCart()
    renderCart()
    })


cartItem.appendChild(plusBtn)
cartItem.appendChild(countBtn)
cartItem.appendChild(minusBtn)
cartItem.appendChild(removeBtn)
      
    })

const totalPrice = cart.reduce((total, item) => {
    return total + (item.price * item.quantity);
}, 0);
  
   const totalDisplay = document.createElement("h3");
   totalDisplay.className = "price"
totalDisplay.textContent = `Total: Rs.${totalPrice}`;

cartContainer.appendChild(totalDisplay);
   
}
