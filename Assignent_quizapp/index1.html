<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

#quiz-container {
    background-color: #ffffff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
}

h2 {
    color: #333;
    margin-bottom: 20px;
    font-size: 1.4rem;
}

.options-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
}

.option-btn {
    background-color: #f0f0f0;
    border: 2px solid #e0e0e0;
    border-radius: 6px;
    padding: 12px 15px;
    font-size: 1rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
}

.option-btn:hover:not(:disabled) {
    background-color: #e2e8f0;
    border-color: #cbd5e1;
}

.option-btn:disabled {
    cursor: not-allowed;
    color: #333;
}

/* State Colors */
.correct {
    background-color: #2ec4b6 !important;
    color: white !important;
    border-color: #2ec4b6 !important;
}

.wrong {
    background-color: #e71d36 !important;
    color: white !important;
    border-color: #e71d36 !important;
}

/* Control Buttons */
.action-btn {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    font-weight: bold;
    color: white;
    background-color: #4361ee;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s;
}

.action-btn:hover {
    background-color: #3f37c9;
}

.hidden {
    display: none;
}

/* Score Screen Styling */
.score-text {
    font-size: 1.2rem;
    color: #4a5568;
    margin-bottom: 8px;
}

.feedback-text {
    font-size: 1.3rem;
    font-weight: bold;
    color: #2d3748;
    margin-bottom: 24px;
}

    </style>
</head>
<body>
    <div id="quiz-container">
        
    </div>

    <script src="script.js"></script>
</body>
</html>
