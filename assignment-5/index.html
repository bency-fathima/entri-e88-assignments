<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopNest — Everyday essentials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="site-header">
        <a class="brand" href="#" aria-label="ShopNest home">ShopNest</a>
        <input id="searchInput" class="search" type="search" placeholder="Search products by name"
            aria-label="Search products" autocomplete="off" />
        <button id="cartToggle" class="cart-btn" type="button" aria-label="Open cart">
            Cart <span id="cartCount" class="cart-count">0</span>
        </button>
    </header>

    <main>
        <nav id="filters" class="filters" aria-label="Product categories"></nav>
        <p id="resultInfo" class="result-info" aria-live="polite"></p>
        <section id="productGrid" class="grid" aria-live="polite"></section>
        <p id="noResults" class="no-results" hidden>No products found. Try a different search or category.</p>
        <p id="loadError" class="no-results" hidden></p>
    </main>

    <div id="overlay" class="overlay" hidden></div>
    <aside id="cartPanel" class="cart-panel" aria-label="Shopping cart" aria-hidden="true">
        <div class="cart-head">
            <h2>Your cart</h2>
            <button id="cartClose" class="icon-btn" type="button" aria-label="Close cart">&times;</button>
        </div>
        <ul id="cartItems" class="cart-items"></ul>
        <p id="cartEmpty" class="cart-empty">Your cart is empty. Add something you like.</p>
        <div class="cart-foot">
            <div class="total-row"><span>Total</span><strong id="cartTotal">₹0</strong></div>
            <button id="clearCart" class="ghost-btn" type="button">Clear cart</button>
        </div>
    </aside>

    <script src="script.js"></script>
</body>

</html>
